server {
    listen 80;
    listen [::]:80;
    server_name weihaiyaosheng.cn www.weihaiyaosheng.cn weihaiyaosheng.com www.weihaiyaosheng.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weihaiyaosheng.cn www.weihaiyaosheng.cn weihaiyaosheng.com www.weihaiyaosheng.com;

    ssl_certificate /etc/letsencrypt/live/weihaiyaosheng.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weihaiyaosheng.cn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
